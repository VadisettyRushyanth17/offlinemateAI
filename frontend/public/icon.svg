<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D14" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#1F2937" stroke-width="4" />
  
  <!-- Outer Glow Rings -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#brandGrad)" stroke-width="3" stroke-dasharray="12 12" opacity="0.3" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="url(#brandGrad)" stroke-width="2" opacity="0.4" />

  <!-- Central Offline AI Emblem -->
  <g filter="url(#glow)">
    <!-- Circuit & Brain Geometry -->
    <path d="M256 120 L350 174 L350 282 L256 336 L162 282 L162 174 Z" 
          fill="none" stroke="url(#brandGrad)" stroke-width="12" stroke-linejoin="round" />
    
    <!-- Inner Core & Disconnected/Local Offline Symbol -->
    <circle cx="256" cy="228" r="38" fill="url(#brandGrad)" />
    <path d="M256 266 L256 380" stroke="url(#brandGrad)" stroke-width="10" stroke-linecap="round" />
    <circle cx="256" cy="380" r="14" fill="#38BDF8" />
    
    <!-- Connection Nodes -->
    <circle cx="162" cy="174" r="10" fill="#6366F1" />
    <circle cx="350" cy="174" r="10" fill="#38BDF8" />
    <circle cx="350" cy="282" r="10" fill="#8B5CF6" />
    <circle cx="162" cy="282" r="10" fill="#6366F1" />
  </g>
</svg>
